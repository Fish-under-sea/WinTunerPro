appId: com.fishundersea.wintunerpro
productName: WinTuner Pro
copyright: Copyright © 2026 Fish-under-sea

directories:
  output: release
  buildResources: build

# 仅打包编译产物与运行所需文件；离线大资源（resources/）默认不入包，后续按需外挂
files:
  - out/**
  - package.json

# PowerShell 脚本与离线资源随包分发，运行态由主进程按 process.resourcesPath/{scripts,resources} 定位调用。
# resources/ 携带离线安装包（如 themes/nexus/NexusSetup.exe）与风格包，保证无网络也可完整安装。
extraResources:
  - from: scripts
    to: scripts
  - from: resources
    to: resources

win:
  target:
    - nsis
  # 关键：应用以管理员权限运行（启动弹 UAC），承载系统级 PowerShell 调度
  requestedExecutionLevel: requireAdministrator
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
